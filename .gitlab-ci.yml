# GitLab CI/CD pipeline for mlvpn-rs, running on jpps-linux-builder's
# shell executor.
#
# History: earlier revisions of this file used the Docker executor,
# QEMU-emulating an entire arm64 container per job (image.docker.platform)
# since there was no native arm64 runner. That worked (confirmed via
# real pipeline runs) but was slow -- QEMU was emulating the compiler
# itself, not just the final binary, so an arm64 leg routinely took
# 40-50 minutes. jpps-linux-builder was then given a real cross-compiler
# toolchain (gcc-aarch64-linux-gnu/libc6-dev-arm64-cross), mold, and
# sccache, and switched to the shell executor as its primary mode
# (Docker is still installed on the host but is no longer primary).
# arm64 coverage is now genuine cross-compilation: only the linker
# frontend runs cross, rustc itself always runs natively as amd64,
# which is why this is dramatically faster than emulating a whole
# container.
#
# Packaging also switched tools: cargo-deb/cargo-generate-rpm instead
# of dpkg-buildpackage/rpmbuild, metadata in Cargo.toml's
# [package.metadata.deb]/[package.metadata.generate-rpm]. This produces
# one generic .rpm per arch (no fedora/rhel %{?dist} split -- there's no
# rpmbuild spec-file processing in this path to generate that from).
#
# .github/workflows/{ci,release}.yml are UNCHANGED: they still use the
# original debian/rules + packaging/rpm/mlvpn.spec + Docker-based
# per-distro containers on GitHub-hosted runners. The two pipelines are
# now genuinely different packaging implementations of the same
# maintainer-script logic -- see packaging/deb-scripts/ and
# packaging/rpm-scripts/'s own comments for why those scripts are
# separate files from debian/ and packaging/rpm/mlvpn.spec, not shared.

stages:
  - test
  - package
  - release

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/sccache
  # Scoped per-target rather than a global RUSTFLAGS, so this only ever
  # touches the actual build target -- not host-side build-script/
  # proc-macro compilation, which cargo always does for the host
  # architecture regardless of --target.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

.cargo_cache:
  cache:
    key: rust-cache-${CI_COMMIT_REF_SLUG}-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/

test:
  stage: test
  tags: [linux]
  extends: .cargo_cache
  script:
    - cargo build --release --locked
    - cargo nextest run --release --locked --lib
    - cargo clippy --release --locked --all-targets -- -D warnings
    - cargo fmt --check

# --- Packaging + release --------------------------------------------
#
# Runs automatically on a version tag push; also exposed as a manual
# job on other pipelines (packaging changes can be test-built on a
# branch, downloaded from the job's own artifacts, without cutting a
# release). allow_failure: true on the manual rule so an un-clicked
# manual job never shows as blocking/red on branch pipelines.
#
# Packages are uploaded to this project's own Generic Package Registry
# (only when $CI_COMMIT_TAG is set), then the `release` job attaches
# those uploads as asset links on a real GitLab Release.

.package_rules: &package_rules
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true

.upload_generic_package:
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for f in dist/*.deb dist/*.rpm; do
          [ -e "$f" ] || continue
          name=$(basename "$f")
          echo "Uploading ${name} to the generic package registry..."
          curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mlvpn/${CI_COMMIT_TAG}/${name}"
        done
      fi

package:deb:amd64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - cargo build --release --locked
    - cargo deb --no-build
    - mkdir -p dist
    - cp target/debian/*.deb dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 30 days

package:deb:arm64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - cargo build --release --locked --target aarch64-unknown-linux-gnu
    - cargo deb --target aarch64-unknown-linux-gnu --no-build
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/debian/*.deb dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 30 days

package:rpm:amd64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - cargo build --release --locked
    - cargo generate-rpm
    - mkdir -p dist
    - cp target/generate-rpm/*.rpm dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
  artifacts:
    paths:
      - dist/*.rpm
    expire_in: 30 days

package:rpm:arm64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - cargo build --release --locked --target aarch64-unknown-linux-gnu
    - cargo generate-rpm --target aarch64-unknown-linux-gnu
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/generate-rpm/*.rpm dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
  artifacts:
    paths:
      - dist/*.rpm
    expire_in: 30 days

release:
  stage: release
  tags: [linux]
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - package:deb:amd64
    - package:deb:arm64
    - package:rpm:amd64
    - package:rpm:arm64
  script:
    - bash scripts/gitlab-release.sh
