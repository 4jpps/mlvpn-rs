# GitLab CI/CD pipeline for mlvpn-rs, running on jpps-linux-builder's
# shell executor.
#
# History: earlier revisions of this file used the Docker executor,
# QEMU-emulating an entire arm64 container per job (image.docker.platform)
# since there was no native arm64 runner. That worked (confirmed via
# real pipeline runs) but was slow -- QEMU was emulating the compiler
# itself, not just the final binary, so an arm64 leg routinely took
# 40-50 minutes. jpps-linux-builder was then given a real cross-compiler
# toolchain (gcc-aarch64-linux-gnu/libc6-dev-arm64-cross), mold, and
# sccache, and switched to the shell executor as its primary mode
# (Docker is still installed on the host but is no longer primary).
# arm64 coverage is now genuine cross-compilation: only the linker
# frontend runs cross, rustc itself always runs natively as amd64,
# which is why this is dramatically faster than emulating a whole
# container.
#
# Packaging also switched tools: cargo-deb/cargo-generate-rpm instead
# of dpkg-buildpackage/rpmbuild, metadata in Cargo.toml's
# [package.metadata.deb]/[package.metadata.generate-rpm]. This produces
# one generic .rpm per arch (no fedora/rhel %{?dist} split -- there's no
# rpmbuild spec-file processing in this path to generate that from).
#
# .github/workflows/{ci,release}.yml are UNCHANGED: they still use the
# original debian/rules + packaging/rpm/mlvpn.spec + Docker-based
# per-distro containers on GitHub-hosted runners. The two pipelines are
# now genuinely different packaging implementations of the same
# maintainer-script logic -- see packaging/deb-scripts/ and
# packaging/rpm-scripts/'s own comments for why those scripts are
# separate files from debian/ and packaging/rpm/mlvpn.spec, not shared.

stages:
  - test
  - package
  - release

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/sccache
  # Scoped per-target rather than a global RUSTFLAGS, so this only ever
  # touches the actual build target -- not host-side build-script/
  # proc-macro compilation, which cargo always does for the host
  # architecture regardless of --target.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

.cargo_cache:
  # Deliberately NOT keyed on ${CI_COMMIT_REF_SLUG}: a tag pipeline's ref
  # (e.g. v0.5.2) has never built before, so a per-ref key guaranteed a
  # cold cache on every single tagged release even when `main`'s cache
  # from the exact commit being tagged was sitting right there unused --
  # confirmed the hard way on the v0.5.1 release (test job alone ran
  # 15+ minutes cold). Keyed on job name alone so `main` and every tag
  # built from it share one warm cache per job/target.
  cache:
    key: rust-cache-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/

test:
  stage: test
  tags: [linux]
  extends: .cargo_cache
  script:
    - cargo build --release --locked
    - cargo nextest run --release --locked --lib
    - cargo clippy --release --locked --all-targets -- -D warnings
    - cargo fmt --check

# --- Packaging + release --------------------------------------------
#
# Runs automatically on a version tag push; also exposed as a manual
# job on other pipelines (packaging changes can be test-built on a
# branch, downloaded from the job's own artifacts, without cutting a
# release). allow_failure: true on the manual rule so an un-clicked
# manual job never shows as blocking/red on branch pipelines.
#
# Packages are uploaded to this project's own Generic Package Registry
# (only when $CI_COMMIT_TAG is set), then the `release` job attaches
# those uploads as asset links on a real GitLab Release.

.package_rules: &package_rules
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true

# Only a clean vX.Y.Z tag is a real Stable release -- everything else
# (a vX.Y.Z-betaN tag, or a manual run with no tag at all) gets a
# package version apt/dnf will recognize as a new build without
# actually bumping Cargo.toml, so it installs over a previous Beta
# build on request. `~betaN` (.deb) / `0.betaN` (.rpm) are each
# format's own convention for "sorts *before* the eventual real
# release with the same base version" -- dpkg's tilde is defined to
# sort earlier than nothing at all, and rpm has no tilde equivalent,
# so a leading "0." on the Release field is the standard substitute
# (rpmvercmp compares Release segment-by-segment, and "0" always loses
# to "1"). Get this backwards and a real release could look *older*
# than a leftover Beta build already installed on a target system,
# which is exactly the failure mode this exists to avoid.
#
# Matches jpps/omnibridge's .beta_build_suffix (the reference
# implementation this project's own old .testing_build_suffix was
# originally adapted *from*) -- SUFFIX is derived from the tag itself
# (e.g. v0.7.3-beta6 -> beta6), not an unrelated pipeline counter, so
# the package version always matches the tag that produced it and one
# Beta build can be told apart from another sharing the same base
# version. Falls back to the pipeline IID only if the tag has no
# "-suffix" part at all to extract (a bare non-semver tag with no dash).
#
# Note this only renames the package-version suffix and the
# user-facing "Beta" label -- it does NOT rename the apt-repo-server's
# `testing` sub-repo itself (still `repo.jpps.us/testing`, shared
# infrastructure already in other projects' sources.list files; see
# jpps_stable_beta_release_pattern memory).
.beta_build_suffix:
  script:
    - |
      if echo "${CI_COMMIT_TAG:-}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        DEB_REVISION_ARG=""
        RPM_RELEASE_OVERRIDE=""
        PKG_DISTRIBUTION="stable"
        unset MLVPN_BUILD_SUFFIX
      else
        RAW_SUFFIX="${CI_COMMIT_TAG#*-}"
        SUFFIX=$(echo "$RAW_SUFFIX" | tr -cd 'a-zA-Z0-9')
        if [ -z "$SUFFIX" ] || [ "$RAW_SUFFIX" = "$CI_COMMIT_TAG" ]; then
          SUFFIX="beta${CI_PIPELINE_IID}"
        fi
        echo "not a clean vX.Y.Z release tag -- building as a Beta release (suffix: ${SUFFIX})"
        DEB_REVISION_ARG="--deb-revision=~${SUFFIX}"
        RPM_RELEASE_OVERRIDE="0.${SUFFIX}"
        PKG_DISTRIBUTION="testing"
        # Compiled into the binary itself via `option_env!` (see
        # `mlvpn::version()`, src/lib.rs) so mlvpn-tui/the VersionInfo
        # wire exchange/`mlvpnd --self-test`'s peer-version report show
        # e.g. "0.7.3-beta7", not just the bare Cargo.toml "0.7.3" a
        # Stable release would also show -- must be exported (not just
        # set) so the later `cargo build` line in this same job's shell
        # actually sees it at compile time.
        export MLVPN_BUILD_SUFFIX="$SUFFIX"
      fi

# gitlab.jpps.us is Cloudflare-tunnel-fronted, and that tunnel path
# stalls/corrupts uploads above a few MB (see the global CLAUDE.md's
# "Bypassing the Cloudflare tunnel" section -- confirmed on srt-matrix
# by hitting nginx on the GitLab VM directly and getting an instant
# clean response vs. a multi-minute hang + Cloudflare 524). Route
# through ci-relay's SSH port-forward straight to the VM's local
# nginx instead of over the public URL. GITLAB_RELAY_SSH_KEY is a
# group-level file variable for a dedicated `ci-relay` user whose
# authorized_keys entry is locked to `permitopen="127.0.0.1:80"` with
# no shell -- it can only relay to nginx, nothing else on the host.
.setup_relay_tunnel:
  script:
    - |
      mkdir -p ~/.ssh
      grep -qF "172.16.60.141 ssh-ed25519" ~/.ssh/known_hosts 2>/dev/null || \
        echo "172.16.60.141 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMhN9SFlktJjOM7IVr0gfTPTug9OCbfcqt983cHwn5Hh" >> ~/.ssh/known_hosts
      cp "${GITLAB_RELAY_SSH_KEY}" ~/.ssh/ci_relay_key
      chmod 600 ~/.ssh/ci_relay_key
      pgrep -f "ci_relay_key -L 18080" > /dev/null || \
        ssh -o BatchMode=yes -i ~/.ssh/ci_relay_key -L 18080:127.0.0.1:80 -N -f ci-relay@172.16.60.141
      export RELAY_API_URL="http://127.0.0.1:18080/api/v4"

.upload_generic_package:
  script:
    - !reference [.setup_relay_tunnel, script]
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for f in dist/*.deb dist/*.rpm; do
          [ -e "$f" ] || continue
          name=$(basename "$f")
          echo "Uploading ${name} to the generic package registry..."
          curl --fail --header "Host: gitlab.jpps.us" --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
            "${RELAY_API_URL}/projects/${CI_PROJECT_ID}/packages/generic/mlvpn/${CI_COMMIT_TAG}/${name}"
        done
      fi

# Publishes to both this project's AND its group's (jpps,
# CI_PROJECT_NAMESPACE_ID) native Debian package registries -- real
# apt-installable repos, not just a downloadable file like the generic
# registry above. Exactly what Jeff's "throwaway builds I can pull to
# my systems" workflow wants (apt install/upgrade directly, no manual
# download step); publishing to both lets him point systems at either
# the per-project repo or a shared group-wide one.
#
# Getting here took real back-and-forth: two wrong endpoint shapes
# (`packages/debian/debian/incoming/<file>`, then
# `packages/debian/<file>?distribution=X&component=main` without a
# distribution to receive it) both 404ed. Creating the distributions
# (`POST .../debian_distributions?codename=X`) got past that, but a
# 401 remains even with route_authentication_setting confirmed correct
# on the live route, a valid non-expired non-revoked token, and every
# relevant ability check returning true -- traced all the way through
# Gitlab::Auth::AuthFinders, PersonalAccessToken lookup, and
# AccessTokenValidationService with no exception logged anywhere, in
# process via Rack::MockRequest against the live app. Genuinely
# unresolved. NOT CURRENTLY WIRED IN to either deb job -- see
# .publish_to_apt_repo below for what actually ships packages now.
.upload_debian_registry:
  script:
    - |
      PACKAGE_FILE=$(ls dist/*.deb)
      FILENAME=$(basename "$PACKAGE_FILE")
      echo "Uploading ${FILENAME} to the project Debian registry (distribution=${PKG_DISTRIBUTION})..."
      curl --fail --request PUT --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$PACKAGE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/debian/${FILENAME}?distribution=${PKG_DISTRIBUTION}&component=main"
      echo "Uploading ${FILENAME} to the group Debian registry (distribution=${PKG_DISTRIBUTION})..."
      curl --fail --request PUT --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$PACKAGE_FILE" \
           "${CI_API_V4_URL}/groups/${CI_PROJECT_NAMESPACE_ID}/-/packages/debian/${FILENAME}?distribution=${PKG_DISTRIBUTION}&component=main"

# Publishes to the self-hosted apt repo on 172.16.61.177 (jpps/
# apt-repo-server project) instead -- built as a fallback once the
# native GitLab Debian registry's unresolved 401 (see
# .upload_debian_registry above) made it clear that path wasn't
# reliable yet. Flat apt repo format, stable/testing sub-repos
# matching PKG_DISTRIBUTION. APT_REPO_SSH_KEY is a group-level
# (jpps) file-type CI/CD variable holding a dedicated key for the
# restricted `apt-publish` user on that host -- scoped to just
# /srv/apt-repo, not a general-purpose credential.
.publish_to_apt_repo:
  script:
    - |
      PACKAGE_FILE=$(ls dist/*.deb)
      FILENAME=$(basename "$PACKAGE_FILE")
      mkdir -p ~/.ssh
      # GitLab writes file-type CI/CD variables at 0664 -- SSH refuses
      # to use a private key that permissive ("bad permissions",
      # confirmed via a real failed run), so copy it somewhere we
      # control the mode on rather than using $APT_REPO_SSH_KEY directly.
      cp "${APT_REPO_SSH_KEY}" ~/.ssh/apt_repo_key
      chmod 600 ~/.ssh/apt_repo_key
      # Idempotent: shell-executor jobs reuse the same $HOME across
      # runs on this runner, so this must not grow known_hosts forever.
      grep -qF "172.16.61.177 ssh-ed25519" ~/.ssh/known_hosts 2>/dev/null || \
        echo "172.16.61.177 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJgzIRW9s8JQothWIuOYQ5XUrkNWsSeUiuzM473YswnW" >> ~/.ssh/known_hosts
      echo "Publishing ${FILENAME} to the self-hosted apt repo (distribution=${PKG_DISTRIBUTION})..."
      scp -i ~/.ssh/apt_repo_key "$PACKAGE_FILE" "apt-publish@172.16.61.177:/tmp/${FILENAME}"
      ssh -i ~/.ssh/apt_repo_key apt-publish@172.16.61.177 \
        "/home/apt-publish/publish-to-apt-repo ${PKG_DISTRIBUTION} /tmp/${FILENAME} && rm -f /tmp/${FILENAME}"

package:deb:amd64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - !reference [.beta_build_suffix, script]
    - cargo build --release --locked
    # Same stale-output issue as cargo-generate-rpm: a leftover .deb
    # from an earlier cached run on this ref (different version
    # suffix) sits alongside the new one otherwise, and dist/ ends up
    # with two files -- confirmed via a real run breaking the
    # PACKAGE_FILE=$(ls dist/*.deb) pattern downstream.
    - rm -f target/debian/*.deb
    - cargo deb --no-build ${DEB_REVISION_ARG}
    - mkdir -p dist
    - cp target/debian/*.deb dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
    - !reference [.publish_to_apt_repo, script]
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 30 days

package:deb:arm64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - !reference [.beta_build_suffix, script]
    - cargo build --release --locked --target aarch64-unknown-linux-gnu
    # See package:deb:amd64's own comment on this same line.
    - rm -f target/aarch64-unknown-linux-gnu/debian/*.deb
    - cargo deb --target aarch64-unknown-linux-gnu --no-build ${DEB_REVISION_ARG}
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/debian/*.deb dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
    - !reference [.publish_to_apt_repo, script]
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 30 days

package:rpm:amd64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - !reference [.beta_build_suffix, script]
    - cargo build --release --locked
    # Unlike cargo-deb, cargo-generate-rpm doesn't clean its own output
    # dir -- a stale .rpm from an earlier cached run on this same ref
    # (e.g. an un-suffixed one from before this version-suffix feature
    # existed, or from a previous testing build) would otherwise sit
    # alongside the new one and both get copied to dist/ below.
    # Confirmed via a real run: rpm:amd64 shipped two files until this
    # rm was added.
    - rm -f target/generate-rpm/*.rpm
    - |
      if [ -n "${RPM_RELEASE_OVERRIDE}" ]; then
        cargo generate-rpm -s "release = \"${RPM_RELEASE_OVERRIDE}\""
      else
        cargo generate-rpm
      fi
    - mkdir -p dist
    - cp target/generate-rpm/*.rpm dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
  artifacts:
    paths:
      - dist/*.rpm
    expire_in: 30 days

package:rpm:arm64:
  stage: package
  tags: [linux]
  extends: .cargo_cache
  <<: *package_rules
  script:
    - !reference [.beta_build_suffix, script]
    - cargo build --release --locked --target aarch64-unknown-linux-gnu
    # See package:rpm:amd64's own comment on this same line -- same
    # stale-output reasoning, cross-compiled output directory.
    - rm -f target/aarch64-unknown-linux-gnu/generate-rpm/*.rpm
    - |
      if [ -n "${RPM_RELEASE_OVERRIDE}" ]; then
        cargo generate-rpm --target aarch64-unknown-linux-gnu -s "release = \"${RPM_RELEASE_OVERRIDE}\""
      else
        cargo generate-rpm --target aarch64-unknown-linux-gnu
      fi
    - mkdir -p dist
    - cp target/aarch64-unknown-linux-gnu/generate-rpm/*.rpm dist/
    - ls -la dist/
    - !reference [.upload_generic_package, script]
  artifacts:
    paths:
      - dist/*.rpm
    expire_in: 30 days

release:
  stage: release
  tags: [linux]
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - package:deb:amd64
    - package:deb:arm64
    - package:rpm:amd64
    - package:rpm:arm64
  script:
    - !reference [.setup_relay_tunnel, script]
    - bash scripts/gitlab-release.sh
