# GitLab CI/CD pipeline, mirroring .github/workflows/ci.yml and
# release.yml -- this repo's primary CI now lives here (self-hosted
# gitlab.tech.lan); GitHub Actions stays in place for now as the
# secondary/confirmed-working sync target's own CI, unmodified.
#
# Runners (see `jpps-linux-builder`, instance-wide, Docker executor,
# tags: linux/deb/rpm): amd64-native. arm64 has no native runner, so
# arm64 jobs run via Docker-in-Docker (services: [docker:*-dind]) with
# an explicit `docker run --platform linux/arm64 ...` inside the job --
# this GitLab Runner version's own image: has no platform: selection
# for the Docker executor (confirmed via a real failed pull: "no
# matching manifest for linux/amd64/v2", the same error regardless of
# which image was named -- the Docker daemon requests a pull matching
# the *runner host's* own platform no matter what, so even a
# single-arch arm64v8/... image was rejected before a container ever
# started). QEMU emulation (multiarch/qemu-user-static, registered on
# the runner host) makes the *explicit* --platform request work once
# it's actually made via `docker run` instead. Needs the runner's own
# config.toml to have `privileged = true` under [runners.docker] for
# the nested daemon to work at all -- confirmed set on
# jpps-linux-builder before this was written.
#
# The nested arm64 container clones the repo fresh via git rather than
# trying to bind-mount the outer job's checkout -- Docker-in-Docker's
# nested daemon doesn't share the outer filesystem, so a bind mount
# would need extra volume-sharing setup for no real benefit here.
# Expect this to be meaningfully slower than the native amd64 job:
# QEMU user-mode emulation of a full `cargo build` is commonly an
# order of magnitude slower than native, which is the real cost of not
# having an actual arm64 runner.

stages:
  - test

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # Latest stable, not the literal `rust-version = "1.86"` pinned in
  # Cargo.toml -- matches what .github/workflows/ci.yml's
  # dtolnay/rust-toolchain@stable actually resolves to (always current
  # stable, not literally 1.86). Confirmed 1.86 itself is now too old
  # for this project's current Cargo.lock: darling 0.23.0, ratatui
  # 0.30.2, and instability 0.3.12 all require rustc 1.88+. GitHub
  # Actions never caught this drift because it never tests the
  # literally-declared MSRV either.
  RUST_IMAGE: rust:bookworm

.cargo_cache:
  cache:
    key: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/

.build_and_test:
  stage: test
  tags: [linux]
  extends: .cargo_cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config libc6-dev
    - rustup component add rustfmt clippy
  script:
    - cargo build --release --locked
    - cargo test --release --locked --lib
    - cargo clippy --release --locked --all-targets -- -D warnings
    - cargo fmt --check

test:amd64:
  extends: .build_and_test
  image: ${RUST_IMAGE}

test:arm64:
  stage: test
  tags: [linux]
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # Registers QEMU's binfmt_misc handlers inside *this* nested DinD
    # daemon specifically -- a host-level `qemu-user-static` registration
    # (already done on the runner host) isn't guaranteed visible to a
    # daemon running inside a Docker-in-Docker service container.
    # Confirmed necessary, not just theoretical: the very first working
    # DinD service still failed the actual arm64 run with
    # `exec /usr/bin/sh: exec format error` -- the image pulled fine
    # (proving --platform itself works), but nothing could execute the
    # arm64 binaries inside it until this ran.
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - >
      docker run --rm --platform linux/arm64
      -e CI_REPOSITORY_URL="$CI_REPOSITORY_URL"
      -e CI_COMMIT_SHA="$CI_COMMIT_SHA"
      ${RUST_IMAGE}
      sh -c "
        set -e &&
        apt-get update -qq &&
        apt-get install -y -qq build-essential pkg-config libc6-dev git &&
        git clone --quiet \"\$CI_REPOSITORY_URL\" /src &&
        cd /src && git checkout --quiet \"\$CI_COMMIT_SHA\" &&
        rustup component add rustfmt clippy &&
        cargo build --release --locked &&
        cargo test --release --locked --lib &&
        cargo clippy --release --locked --all-targets -- -D warnings &&
        cargo fmt --check
      "
