# GitLab CI/CD pipeline, mirroring .github/workflows/ci.yml and
# release.yml -- this repo's primary CI now lives here (self-hosted
# gitlab.tech.lan); GitHub Actions stays in place for now as the
# secondary/confirmed-working sync target's own CI, unmodified.
#
# Runners (see `jpps-linux-builder`, instance-wide, Docker executor,
# tags: linux/deb/rpm): amd64-native. arm64 has no native runner, so
# arm64 jobs pin `image: docker: platform: linux/arm64` -- the Docker
# executor's own native per-job platform selection, requesting that
# exact platform from the registry and letting the runner host's own
# Docker daemon run it directly via QEMU emulation
# (multiarch/qemu-user-static, already registered there). No nested
# Docker-in-Docker needed: that was this file's first working
# approach, but doubles the virtualization overhead (a nested daemon,
# itself needing its own QEMU registration -- confirmed a real
# `exec format error` the host-level registration didn't clear on its
# own) for no benefit once the correct native syntax was found. Get
# the nesting exactly right: `platform` sits under a `docker:` sub-key
# *inside* `image:`, not as a sibling of `name:` -- the latter is
# rejected outright by this GitLab version's CI lint as an unknown
# key (confirmed), which is what led to the DinD detour in the first
# place.
#
# Expect this to still be meaningfully slower than the native amd64
# job: QEMU user-mode emulation of a full `cargo build` is commonly an
# order of magnitude slower than native, which is the real cost of not
# having an actual arm64 runner -- just without DinD's extra layer on
# top of that cost.

stages:
  - test

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # Latest stable, not the literal `rust-version = "1.86"` pinned in
  # Cargo.toml -- matches what .github/workflows/ci.yml's
  # dtolnay/rust-toolchain@stable actually resolves to (always current
  # stable, not literally 1.86). Confirmed 1.86 itself is now too old
  # for this project's current Cargo.lock: darling 0.23.0, ratatui
  # 0.30.2, and instability 0.3.12 all require rustc 1.88+. GitHub
  # Actions never caught this drift because it never tests the
  # literally-declared MSRV either.
  RUST_IMAGE: rust:bookworm

.cargo_cache:
  cache:
    key: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/

.build_and_test:
  stage: test
  tags: [linux]
  extends: .cargo_cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config libc6-dev
    - rustup component add rustfmt clippy
  script:
    - cargo build --release --locked
    - cargo test --release --locked --lib
    - cargo clippy --release --locked --all-targets -- -D warnings
    - cargo fmt --check

test:amd64:
  extends: .build_and_test
  image: ${RUST_IMAGE}

test:arm64:
  extends: .build_and_test
  image:
    name: ${RUST_IMAGE}
    docker:
      platform: linux/arm64
