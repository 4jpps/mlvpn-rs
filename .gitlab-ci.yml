# GitLab CI/CD pipeline, mirroring .github/workflows/ci.yml and
# release.yml -- this repo's primary CI now lives here (self-hosted
# gitlab.tech.lan); GitHub Actions stays in place for now as the
# secondary/confirmed-working sync target's own CI, unmodified.
#
# Runners (see `jpps-linux-builder`, instance-wide, Docker executor,
# tags: linux/deb/rpm): amd64-native only for now. arm64 coverage is
# deliberately NOT included yet -- see the conversation/commit history
# around this file's introduction for why: this GitLab Runner version's
# *Docker* executor (as opposed to Kubernetes executor, which does
# support it) has no `platform:` selection for `image:`, and the
# Docker daemon itself requests a pull matching the *host's* own
# platform regardless of what image is named, so even an
# architecture-specific `arm64v8/...` image gets rejected outright
# before a container ever starts -- confirmed by a real failed pipeline
# job, not a guess. Getting arm64 working here for real needs either a
# genuine arm64 runner, or restructuring these jobs around
# Docker-in-Docker with explicit `docker run --platform linux/arm64`
# calls (which needs a privileged runner config -- an infrastructure
# change to confirm before making, not something to silently assume).

stages:
  - test

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # Latest stable, not the literal `rust-version = "1.86"` pinned in
  # Cargo.toml -- matches what .github/workflows/ci.yml's
  # dtolnay/rust-toolchain@stable actually resolves to (always current
  # stable, not literally 1.86). Confirmed 1.86 itself is now too old
  # for this project's current Cargo.lock: darling 0.23.0, ratatui
  # 0.30.2, and instability 0.3.12 all require rustc 1.88+. GitHub
  # Actions never caught this drift because it never tests the
  # literally-declared MSRV either.
  RUST_IMAGE: rust:bookworm

.cargo_cache:
  cache:
    key: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target/

.build_and_test:
  stage: test
  tags: [linux]
  extends: .cargo_cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config libc6-dev
    - rustup component add rustfmt clippy
  script:
    - cargo build --release --locked
    - cargo test --release --locked --lib
    - cargo clippy --release --locked --all-targets -- -D warnings
    - cargo fmt --check

test:amd64:
  extends: .build_and_test
  image: ${RUST_IMAGE}
