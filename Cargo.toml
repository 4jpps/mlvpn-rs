[package]
name = "mlvpn"
version = "0.7.6"
edition = "2021"
rust-version = "1.86"
authors = ["Jeff Parrish PC Services LLC <www.jpps.us>"]
description = "Multi-link VPN bonding daemon: combines several network uplinks into one resilient, WireGuard-encrypted tunnel with automatic latency/jitter/throughput-aware failover."
license = "AGPL-3.0-only"
repository = "https://github.com/4jpps/mlvpn-rs"
homepage = "https://github.com/4jpps/mlvpn-rs"
default-run = "mlvpnd"

[lib]
name = "mlvpn"
path = "src/lib.rs"

[[bin]]
name = "mlvpnd"
path = "src/main.rs"

[[bench]]
name = "wg_path"
harness = false

# src/bin/mlvpn-tui/main.rs is picked up automatically by cargo's default
# `autobins` discovery -- no explicit [[bin]] section needed for it.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"
snow = { version = "0.10", features = ["default-resolver"] }
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tun-rs = { version = "2", features = ["async"] }
nix = { version = "0.27", features = ["user", "process", "net", "hostname"] }
caps = "0.5"
bytes = "1"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
boringtun = "0.7"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Monitoring TUI (src/bin/mlvpn-tui/) only -- not used by mlvpnd itself,
# but cargo builds both binaries from one dependency set regardless.
#
# 0.30 (not 0.29): 0.29 pins its internal `lru` dependency to "0.12.0",
# which resolves to 0.12.5 -- affected by RUSTSEC's lru IterMut
# soundness advisory (fixed in 0.16.3). `[patch]` can't bridge that gap
# (0.12.x and 0.16.x are semver-incompatible pre-1.0 minors, and Cargo
# patches must stay within the original requirement's range), so the
# only real fix is following ratatui's own dependency bump. Checked
# ratatui's BREAKING-CHANGES.md for 0.30 against this file's actual
# usage: none of it touches removed `block::Title`, the `Style`/
# `Stylize` split, or the `Alignment` rename, so this should be a
# behavior-neutral bump -- but see docs/development.md and verify with
# a real `cargo build`/`test` regardless, this wasn't compiled here.
# default-features trimmed against ratatui 0.30.2's actual
# [features]/[dependencies] tables (checked via docs.rs source, not
# assumed): default = ["all-widgets", "crossterm", "layout-cache",
# "macros", "underline-color"]. `ratatui-crossterm`/`-termina`/
# `-termwiz`/`-termion`/`-macros` are each `optional = true`, gated by
# their like-named feature -- we only enable "crossterm", so those
# other backend/macro crates should be excluded. `all-widgets` (not
# enabled here) is what pulls in the calendar widget's `time`
# dependency via `ratatui-widgets/calendar`; without it, `time`
# shouldn't enter the graph via ratatui at all. `layout-cache` kept
# since 0.30's breaking-changes notes recommend it for performance.
# Confirmed via `cargo tree -p ratatui` against a real build: no
# ratatui-termina, ratatui-termwiz, or time in the resolved graph.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
crossterm = "0.28"

[dev-dependencies]
proptest = "1"
# test-util (tokio::time::{pause,advance}, #[tokio::test(start_paused = true)])
# is dev/test-only -- merged into the main `tokio` dependency's feature set
# by cargo for test builds, never enabled in the real release binary.
tokio = { version = "1", features = ["test-util"] }

# cargo-deb metadata -- built by the GitLab CI `package:deb:*` jobs
# (.gitlab-ci.yml). Maintainer scripts live in packaging/deb-scripts/
# rather than debian/, which stays as-is for the dpkg-buildpackage path
# .github/workflows/release.yml still uses -- see packaging/deb-scripts/
# postinst's own comment for why these can't just be the same files
# (cargo-deb needs plain "postinst", debhelper needs "mlvpn.postinst").
# If you change one script, change its twin too.
[package.metadata.deb]
maintainer = "Jeff Parrish PC Services LLC <www.jpps.us>"
copyright = "2026, Jeff Parrish PC Services LLC <www.jpps.us>"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
# $auto: shlibs-style auto-detected shared library deps (ldd against
# the built binaries), same as debian/control's ${shlibs:Depends}.
# adduser: same as debian/control's explicit Depends -- postinst calls
# addgroup/adduser directly, matching debian/mlvpn.postinst.
depends = "$auto, adduser"
extended-description = """\
mlvpn bonds several physical network uplinks (e.g. fiber + LTE) into a \
single encrypted tunnel, load-balancing and failing over between them \
based on continuously measured latency, jitter, loss and throughput.
.
This is a Rust rewrite built on the Noise Protocol Framework \
(Noise_IK, the same family WireGuard uses) for a single-round-trip, \
mutually authenticated, forward-secret handshake.
.
Includes mlvpn-tui, a terminal monitoring view that shows every bonded \
link's state, peer address, and both sides' measured RTT/jitter/loss/ \
throughput side by side, without needing to compare logs on both ends \
by hand.\
"""
maintainer-scripts = "packaging/deb-scripts"
# Always target/release/... even when cross-compiling -- cargo-deb
# substitutes the real target/<triple>/release/ path itself based on
# whether --target was passed to `cargo deb`.
assets = [
    ["target/release/mlvpnd", "usr/bin/mlvpnd", "755"],
    ["target/release/mlvpn-tui", "usr/bin/mlvpn-tui", "755"],
    ["systemd/mlvpn.service", "lib/systemd/system/mlvpn.service", "644"],
    ["config/mlvpn.toml.example", "usr/share/doc/mlvpn/mlvpn.toml.example", "644"],
    ["config/mlvpn-server.toml.example", "usr/share/doc/mlvpn/mlvpn-server.toml.example", "644"],
]

# cargo-generate-rpm metadata -- built by the GitLab CI
# `package:rpm:*` jobs. Replaces packaging/rpm/mlvpn.spec's own
# rpmbuild-based build for the GitLab pipeline; that spec file stays
# as-is for the .github/workflows/release.yml path. Produces one
# generic .rpm per architecture (no %{?dist} fedora/rhel split -- there
# is no rpmbuild spec-file processing in this path to generate that
# from), unlike the two dist-tagged variants release.yml's build-rpm
# matrix produces.
[package.metadata.generate-rpm]
license = "AGPL-3.0-only"
assets = [
    { source = "target/release/mlvpnd", dest = "/usr/bin/mlvpnd", mode = "755" },
    { source = "target/release/mlvpn-tui", dest = "/usr/bin/mlvpn-tui", mode = "755" },
    { source = "systemd/mlvpn.service", dest = "/usr/lib/systemd/system/mlvpn.service", mode = "644" },
    { source = "config/mlvpn.toml.example", dest = "/usr/share/doc/mlvpn/mlvpn.toml.example", mode = "644", doc = true },
    { source = "config/mlvpn-server.toml.example", dest = "/usr/share/doc/mlvpn/mlvpn-server.toml.example", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/mlvpn/LICENSE", mode = "644", doc = true },
]
pre_install_script = "packaging/rpm-scripts/pre_install.sh"
post_install_script = "packaging/rpm-scripts/post_install.sh"
pre_uninstall_script = "packaging/rpm-scripts/pre_uninstall.sh"

[package.metadata.generate-rpm.requires]
shadow-utils = "*"
